[project]
name = "qualiagent"
version = "0.1.0"
description = "Qualitative research analysis with grounded citations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "anthropic>=1.2.0",
    "colorlog>=6.12.0",
    "fastapi>=0.141.1",
    "google-genai>=2.20.0",
    "itsdangerous>=2.2.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pdfminer-six>=20260107",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqladmin[full]>=0.31.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "types-setuptools>=84.0.0.20260812",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qualiagent"]

[tool.hatch.build.targets.wheel.force-include]
"qualiagent/prompts" = "qualiagent/prompts"

[tool.ruff]
target-version = "py314"
line-length = 119
exclude = [
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["qualiagent"]

[[tool.mypy.overrides]]
module = [
    "voyageai.*",
    "pdfminer.*",
    "pgvector.*",
    "docx.*",
    "colorlog.*",
    "langgraph.*",
    "google.*",
    "sqladmin.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
